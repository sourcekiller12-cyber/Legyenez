version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: legyenez-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=legyenez
    networks:
      - legyenez-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legyenez-backend
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
      - ./videos:/app/videos
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=legyenez
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - legyenez-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legyenez-frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8001
    depends_on:
      - backend
    networks:
      - legyenez-network

volumes:
  mongodb_data:

networks:
  legyenez-network:
    driver: bridge
